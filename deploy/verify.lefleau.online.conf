# Nginx - verify.lefleau.online
server {
    listen 80;
    listen [::]:80;
    server_name verify.lefleau.online;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verify.lefleau.online;

    ssl_certificate /etc/letsencrypt/live/verify.lefleau.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verify.lefleau.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/verify.lefleau.online;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /styles.css {
        try_files /styles.css =404;
        access_log off;
        expires 1h;
    }
    location = /privacy { return 301 /privacy/; }
    location = /privacy/ { try_files /privacy/index.html =404; }
    location = /terms { return 301 /terms/; }
    location = /terms/ { try_files /terms/index.html =404; }

    location /roblox/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = / {
        default_type text/html;
        return 200 '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Fléau - Vérification Roblox</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b10;color:#f4f6fb;font:16px/1.6 system-ui}.box{width:min(600px,calc(100% - 48px));padding:36px;border:1px solid #252b38;border-radius:18px;background:#11151e}h1{margin:0 0 12px}p{color:#bdc4d3}.login{display:inline-block;margin:12px 0 24px;padding:12px 18px;border-radius:9px;background:#fff;color:#111;text-decoration:none;font-weight:700}.legal a{color:#aa98ff;margin-right:16px}</style></head><body><main class="box"><h1>Le Fléau · Vérification Roblox</h1><p>Connectez votre identité Roblox de manière sécurisée au service Discord Le Fléau.</p><p>Nous ne demandons jamais votre mot de passe ni votre cookie Roblox.</p><a class="login" href="/roblox/login">Se connecter avec Roblox</a><div class="legal"><a href="/privacy/">Confidentialité</a><a href="/terms/">Conditions</a></div></main></body></html>';
    }

    client_max_body_size 1m;
}
